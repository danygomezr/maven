# .azure-pipelines/pipelines/maven-build-nodebase.yml
name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches: { include: [ main, task/* ] }

pool:
  name: Local-ENV   # agente con Docker (no requiere Maven/Java)

stages:
- stage: Build
  jobs:
  - job: build_in_node_container
    displayName: Build in Node container (install JDK+Maven)
    container:
      image: node:20-bookworm   # tiene node/npm; ADO lo mantiene vivo con node -e ...
    variables:
      MAVEN_LOCAL_REPO: '/root/.m2/repository'

    steps:
    - checkout: self
      clean: true

    # Instalar JDK 17 + Maven dentro del contenedor (Debian/Bookworm)
    - bash: |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends openjdk-17-jdk-headless maven ca-certificates
        # JAVA_HOME dinámico
        export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        mvn -v
        node -v && npm -v
      displayName: "Install JDK 17 + Maven"

    - task: Cache@2
      displayName: "Cache .m2"
      inputs:
        key: 'maven | "$(Agent.OS)" | **/pom.xml'
        restoreKeys: 'maven | "$(Agent.OS)"'
        path: '$(MAVEN_LOCAL_REPO)'

    - bash: |
        set -euo pipefail
        # Asegura JAVA_HOME en cada paso que ejecute Maven
        export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
        export PATH="$JAVA_HOME/bin:$PATH"
        mvn -Dmaven.repo.local="$(MAVEN_LOCAL_REPO)" -U -B -e clean verify
      displayName: "mvn clean verify"
      env:
        MAVEN_OPTS: "-Xmx1g"

    # Diagnóstico (por si los reports no están en la ruta clásica)
    - bash: |
        set +e
        echo "Total TEST-*.xml:"
        find "$(System.DefaultWorkingDirectory)" -type f -name "TEST-*.xml" | wc -l || true
        echo "Ejemplos:"
        find "$(System.DefaultWorkingDirectory)" -type f -name "TEST-*.xml" | head -n 20 || true
      displayName: "Diagnóstico: localizar reportes JUnit"
      condition: always()

    - task: PublishTestResults@2
      displayName: "Publish JUnit"
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        searchFolder: '$(System.DefaultWorkingDirectory)'
        testResultsFiles: |
          **/test-results-surefire/TEST-*.xml
          **/surefire-reports/TEST-*.xml
          **/failsafe-reports/TEST-*.xml
        mergeTestResults: true
        failTaskOnFailedTests: false

    - task: CopyFiles@2
      displayName: "Stage JARs"
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)'
        Contents: '**/target/*.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        flattenFolders: true

    - task: PublishPipelineArtifact@1
      displayName: "Publish artifact(s)"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'maven-drop'
