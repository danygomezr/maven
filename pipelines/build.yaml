# .azure-pipelines/pipelines/maven-build.yml
name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches: { include: [ main, task/* ] }

pool:
  name: Local-ENV   # agente self-hosted macOS

variables:
  # JDK requerido por el build
  JDK_VERSION: '1.17'
  # Repositorio Maven cacheado en el workspace (más predecible que ~/.m2 en self-hosted)
  MAVEN_LOCAL_REPO: '$(Pipeline.Workspace)/.m2/repository'

stages:
- stage: Build
  displayName: "Build & Unit Tests (Maven)"
  jobs:
  - job: maven_build
    displayName: "Compile, Test, Package"
    steps:
    - checkout: self
      clean: true

    # Cache del repositorio local de Maven
    - task: Cache@2
      displayName: "Cache Maven local repo"
      inputs:
        key: 'maven | "$(Agent.OS)" | **/pom.xml'
        restoreKeys: 'maven | "$(Agent.OS)"'
        path: '$(MAVEN_LOCAL_REPO)'

    # Detectar mvnw vs mvn con BASH (no pwsh)
    - bash: |
        set -euo pipefail
        if [ -x "./mvnw" ]; then
          echo "Using Maven Wrapper (./mvnw)"
          ./mvnw -v
          echo "wrapper=true" >> $(Pipeline.Workspace)/mvn.props
        else
          echo "Using system Maven (mvn)"
          command -v mvn || { echo "mvn no está en PATH"; exit 1; }
          mvn -v
          echo "wrapper=false" >> $(Pipeline.Workspace)/mvn.props
        fi
      displayName: "Detect Maven (mvnw vs mvn)"

    # Exponer JAVA_HOME_17_X64 (lo requiere Maven@3 con JDKVersion)
    - bash: |
        set -e
        JH=$(/usr/libexec/java_home -v 17)
        echo "JAVA_HOME_17_X64=$JH"
        echo "##vso[task.setvariable variable=JAVA_HOME_17_X64]$JH"
      displayName: "Set JAVA_HOME_17_X64"

    # Build + Tests (si hay mvnw preferimos wrapper; si no, usamos Maven@3)
    # Caso 1: usar Maven@3 con el Maven de Homebrew (robusto, publica JUnit automáticamente)
    - task: Maven@3
      displayName: "mvn clean verify (Maven@3)"
      condition: and(succeeded(), eq(variables['wrapper'], 'false'))
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean verify'
        options: '-Dmaven.repo.local=$(MAVEN_LOCAL_REPO) -U'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'      # usa JAVA_HOME_17_X64
        jdkVersionOption: '$(JDK_VERSION)'
        jdkArchitectureOption: 'x64'
        mavenVersionOption: 'Path'
        mavenDirectory: '/usr/local/opt/maven/libexec'  # mac Intel (Homebrew)

    # Caso 2: si existe mvnw, invocarlo directamente (evita "demands" del task)
    - bash: |
        set -euo pipefail
        chmod +x ./mvnw
        export JAVA_HOME="$JAVA_HOME_17_X64"
        export PATH="$JAVA_HOME/bin:$PATH"
        java -version
        ./mvnw -Dmaven.repo.local="$(MAVEN_LOCAL_REPO)" -U -B -e clean verify
      displayName: "mvnw clean verify"
      condition: and(succeeded(), eq(variables['wrapper'], 'true'))
      env:
        MAVEN_OPTS: "-Xmx1g"

    # Publicar resultados JUnit (Surefire + Failsafe), SIEMPRE (aunque falle mvn)
    - task: PublishTestResults@2
      displayName: "Publish JUnit (Surefire + Failsafe)"
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: |
          **/surefire-reports/TEST-*.xml
          **/failsafe-reports/TEST-*.xml
        failTaskOnFailedTests: false

    # Publicar artefactos generados
    - task: PublishBuildArtifacts@1
      displayName: "Publish artifact(s)"
      condition: succeeded()
      inputs:
        pathToPublish: '$(System.DefaultWorkingDirectory)/**/target/*.jar'
        artifactName: 'maven-drop'
        publishLocation: 'Container'
